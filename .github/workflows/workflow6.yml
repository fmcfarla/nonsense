name: Workflow Test 6
on:
  workflow_dispatch:
    inputs:
      number:
        description: 'A number'
        required: false
        default: 10

env:
  FAIL_COUNT: 0
  

jobs:
  build_things:
    name: This builds things
    runs-on: ubuntu-slim

    steps:
      - name: Create a file
        run: | 
          echo "Hello, world." > hello.txt
          ls
          echo "This was built with inputs:"
          echo "Number : ${{ github.event.inputs.number }}"
          
      - name: Cache file
        uses: actions/cache/save@v5
        with:
          path: hello.txt
          key: hello-cache-${{ github.run_id }}
          
  matrix_builds:
    name: matrix_build
    runs-on: ubuntu-slim
    needs: build_things
    continue-on-error: true
    env:
      TOTAL_JOBS: ${{ strategy.job-total }}
    strategy:
      max-parallel: 3
      matrix:
