        #   sleep 10
        #   cat hello.txt
        #   num=$(jot -r 1 1 10)
        #   echo $num
        #   if [ "$num" -eq 10 ]; then exit 1; fi
    
  
  
  



  Summary:
    name: summary
    runs-on: ubuntu-slim
    needs: matrix_builds
    steps:
      - name: Count Failures
        run: |
          echo "Total failed jobs: $FAIL_COUNT"
          echo "Total jobs: $TOTAL_JOBS"
