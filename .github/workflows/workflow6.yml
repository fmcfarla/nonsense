name: Workflow Test 6
on:
  workflow_dispatch:
    inputs:
      number:
        description: 'A number'
        required: false
        default: 10

jobs:
  build_things:
    name: This builds things
    runs-on: ubuntu-slim

    steps:
      - name: Create a file
        run: | 
          echo "Hello, world." > hello.txt
          ls
          echo "This was built with inputs:"
          echo "Number : ${{ github.event.inputs.number }}"
          
      - name: Cache file
        uses: actions/cache/save@v5
        with:
          path: hello.txt
          key: hello-cache-${{ github.run_id }}
          
  matrix_builds:
    name: matrix_build
    runs-on: ubuntu-slim
    needs: build_things
    continue-on-error: true
    env:
      TOTAL_JOBS: ${{ strategy.job-total }}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        market: ["aberdeen_sd", "abilene_tx", "adrian_mi", "akron_oh", "alexandria_la", "alliance_oh", "amarillo_tx", "ames_ia", "anderson_sc", "appleton_wi", "asburypark_nj", "asheville_nc", "ashland_oh", "athens_ga", "augusta_ga", "bartlesville_ok"]
    steps:
      # - name: Restore cache
      #   uses: actions/cache/restore@v5
      #   with:
      #     path: hello.txt
      #     key: hello-cache-${{ github.run_id }}
      
      - name: build${{ matrix.market }}
        id: build
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 40
          command: |
            sleep 1
            cat hello.txt
            num=$(shuf -i 1-10 -n 1)
            echo $num
            if [ "$num" -gt 5 ]; then exit 1; fi
            
      - if: ${{ !cancelled() }}
        run: |
          jq -cn  --arg runner ${{ matrix.market }} --arg outcome ${{ steps.build.outcome }} '$ARGS.named' > outcome

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ hashFiles('outcome') }}
          path: outcome
 
      # - name: update count
      #   if: ${{ !cancelled() }}
      #   run: |
      #     UPDATED_FAIL_COUNT=$(( ${{ env.FAIL_COUNT }} + 1 ))
      #     echo "FAIL_COUNT=$UPDATED_FAIL_COUNT" >> $GITHUB_ENV
        
        # run: |
        #   sleep 10
        #   cat hello.txt
        #   num=$(jot -r 1 1 10)
        #   echo $num
        #   if [ "$num" -eq 10 ]; then exit 1; fi
    
  
  
  collect:
    needs: matrix_builds
    runs-on:  ubuntu-slim
    if: ${{ !cancelled() }}
    outputs:
      outcomes: ${{ steps.collect.outputs.outcomes }}
    steps:
      - uses: actions/download-artifact@v4
      - id: collect
        run: |
          outcomes="$(cat */outcome | jq -c --slurp .)"
          echo outcomes=$outcomes >> $GITHUB_OUTPUT  



