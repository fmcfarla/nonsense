    steps:
      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          path: hello.txt
          key: hello-cache-${{ github.run_id }}
      
      - name: build${{ matrix.market }}
        id: build
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 40
          command: |
            sleep 1
            cat hello.txt
            num=$(shuf -i 1-10 -n 1)
            echo $num
            if [ "$num" -eq 10 ]; then exit 1; fi

      - name: update count
        if: steps.build.outcome == 'failure'
        run: |
          UPDATED_FAIL_COUNT=$(( ${{ env.FAIL_COUNT }} + 1 ))
          echo "FAIL_COUNT=$UPDATED_FAIL_COUNT" >> $GITHUB_ENV
        
