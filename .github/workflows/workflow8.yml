name: Workflow Test 8
on:
  workflow_dispatch:
    inputs:
      number:
        description: 'A number'
        required: false
        default: 10

jobs:
  build_things:
    name: This builds things
    runs-on: ubuntu-slim

    steps:
      - name: Create a file
        run: | 
          echo "Hello, world." > hello.txt
          ls
          echo "This was built with inputs:"
          echo "Number : ${{ github.event.inputs.number }}"
          
      - name: Cache file
        uses: actions/cache/save@v5
        with:
          path: hello.txt
          key: hello-cache-${{ github.run_id }}
          
  matrix_builds:
    name: matrix_build
    runs-on: ubuntu-slim
    needs: build_things
    env:
      TOTAL_JOBS: ${{ strategy.job-total }}
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        market: ["aberdeen_sd", "abilene_tx", "adrian_mi", "akron_oh", "alexandria_la", "alliance_oh", "amarillo_tx", "ames_ia", "anderson_sc"]
    steps:
      # - name: Restore cache
      #   uses: actions/cache/restore@v5
      #   with:
      #     path: hello.txt
      #     key: hello-cache-${{ github.run_id }}
      
      - name: build${{ matrix.market }}
        id: build
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 40
          command: |
            sleep 1
            cat hello.txt
            num=$(shuf -i 1-10 -n 1)
            echo $num
            if [ "$num" -gt 5 ]; then exit 1; fi

      - name: Save Matrix Result
        if: always() 
        run: |
          mkdir -p matrix-results
          echo "${{ matrix.market }}: ${{ steps.build.outcome }}" > matrix-results/artifact-${{ matrix.market }}.txt

      - name: Upload Matrix Result Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-results-${{ matrix.market }}
          path: matrix-results/
          archive: false


  generate-summary:
    runs-on: ubuntu-slim
    needs: matrix_builds
    outputs:
      global_num_fails: ${{ steps.summary.outputs.num_fails }}
    if: ${{ !cancelled() }}
    steps:
      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          path: combined-results
          merge-multiple: true

      - name: Build Markdown Table Summary
        id: summary
        run: |
          echo "### 📊 Matrix Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Market | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          # Iterate through saved artifact files and print statuses with matching visual indicators
          for file in combined-results/*.txt; do
            content=$(cat "$file")
            market_name=$(echo "$content" | cut -d':' -f1)
            status=$(echo "$content" | cut -d':' -f2 | xargs)
            
            if [ "$status" = "success" ]; then
              echo "| $market_name | 🟢 Success |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $market_name | 🔴 Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          name="fred"
          num_something=20
          num_fails=$(grep -ro "failed" combined-results/*.txt | wc -l)
          echo "num_fails=$(num_fails)" >> $GITHUB_OUTPUT

  
  slack_summary:
    name: Slack
    runs-on: ubuntu-slim
    needs: generate-summary
    if: ${{ !cancelled() }}
    steps:
      # - name: Download All Matrix Artifacts
      #   uses: actions/download-artifact@v8
      #   with:
      #     pattern: artifact-*
      #     path: combined-results
      #     merge-multiple: true

      # - name: Count Results
      #   run: |
      #     # Iterate through saved artifact files and print statuses with matching visual indicators
      #     for file in combined-results/*.txt; do
      #       content=$(cat "$file")
      #       market_name=$(echo "$content" | cut -d':' -f1)
      #       status=$(echo "$content" | cut -d':' -f2 | xargs)
      #       NUM_FAIL=0
      #       NUM_SUCCESS=0
            
      #       if [ "$status" = "success" ]; then
      #         ((NUM_SUCCESS++))
      #       else
      #         ((NUM_FAIL++))
      #       fi
      #     done

      #     echo "NUM_SUCCESS=$NUM_SUCCESS" >> $GITHUB_ENV
      #     echo "NUM_FAIL=$NUM_FAIL" >> $GITHUB_ENV

      - name: Fake Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: android-ci
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON_EMOJI: ':github-actions:'
          SLACK_TITLE: 'Build All Local Bundles Completed'
          SLACK_MESSAGE_ON_SUCCESS: ':100: https://console.cloud.google.com/storage/browser/native-apps-artifacts/Android/Release-${{github.event.inputs.upload_folder_ver}}'
          SLACK_MESSAGE_ON_FAILURE: ':fail: $${{ needs.generate-summary.outputs.global_num_fails }} builds have failed'
